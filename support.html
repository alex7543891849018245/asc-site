<title>Поддержка — AlexStudio Code</title>
<!-- Подключение Font Awesome для иконок -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="shortcut icon" href="https://i.imgur.com/Svz1Ed7.png">

<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --secondary: #10b981;
  --dark: #0f0f23;
  --darker: #0a0a1a;
  --light: #f8fafc;
  --gray: #64748b;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
  color: var(--light);
  line-height: 1.6;
  overflow: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Анимации */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

/* Навигация */
.navbar {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  padding: 1rem 2rem;
  width: 100%;
  position: fixed;
  top: 0;
  z-index: 1000;
}

.nav-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

/* Секция контента */
.support-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  margin-top: 60px;
  position: relative;
}

.support-container::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
  animation: float 6s ease-in-out infinite;
  z-index: 1;
}

.support-card {
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  padding: 3rem 2rem;
  border-radius: 20px;
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow);
  animation: fadeInUp 0.8s ease forwards;
  z-index: 2;
}

.support-icon {
  font-size: 3rem;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 1.5rem;
}

.support-card h1 {
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 1rem;
  background: linear-gradient(45deg, var(--light), var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.support-card p {
  color: var(--gray);
  font-size: 1rem;
  margin-bottom: 2rem;
}

/* Стилизация кнопки */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 1rem 2rem;
  width: 100%;
  background: linear-gradient(45deg, var(--primary), var(--primary-dark));
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.3s ease;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: all 0.6s ease;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
}

.btn:hover::before {
  left: 100%;
}

.btn:active {
  transform: translateY(-1px);
}

.email-text {
  display: block;
  margin-top: 1rem;
  font-size: 0.85rem;
  color: var(--gray);
  text-decoration: none;
}
.email-text:hover {
  color: var(--primary);
}
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-content">
      <a href="https://alexstudiocode.ru/" class="logo">AlexStudio Code</a>
    </div>
  </nav>

  <main class="support-container">
    <div class="support-card">
      <div class="support-icon">
        <i class="fa-solid fa-headset"></i>
      </div>
      <h1>Служба поддержки</h1>
      <p>Возникли вопросы по работе сервиса или подписки? Нажмите кнопку ниже, чтобы отправить нам письмо.</p>
      
      <a href="mailto:support@alexstudiocode.ru?subject=Поддержка%20Happ" class="btn">
        <i class="fa-solid fa-envelope"></i>
        Написать в поддержку
      </a>

      <a href="mailto:support@alexstudiocode.ru?subject=Поддержка%20Happ" class="email-text">
        support@alexstudiocode.ru
      </a>
    </div>
  </main>

</body>
</html>
